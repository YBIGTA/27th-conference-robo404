# YOLO Dataset Configuration
# Documentation: https://docs.ultralytics.com/datasets/detect/

# Dataset root path (absolute or relative to this file)
path: /home/junchan/github/27th-conference-robo404/training/data

# Train/val/test image directories (relative to 'path')
train: images/train
val: images/val
# test: images/test  # optional

# Class names (must match label_config.yaml)
names:
  0: red_ball
  # 1: door      # uncomment when adding door detection
  # 2: chair
  # 3: sofa

# ============================================================
# Label Format (YOLO format)
# ============================================================
# Each image needs a corresponding .txt file in labels/ directory
# with the same name (e.g., img001.jpg -> img001.txt)
#
# Each line in .txt file represents one object:
#   <class_id> <x_center> <y_center> <width> <height>
#
# All values are normalized to 0.0 ~ 1.0:
#   x_center = (bbox_center_x) / image_width
#   y_center = (bbox_center_y) / image_height
#   width    = (bbox_width) / image_width
#   height   = (bbox_height) / image_height
#
# Example (img001.txt):
#   0 0.45 0.32 0.12 0.25
#   1 0.78 0.65 0.08 0.15
# ============================================================
